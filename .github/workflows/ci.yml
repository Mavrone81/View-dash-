name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Secrets are file-mounted, never env vars: this step writes the denylist
      # secret straight to a file the gate reads, so LEAKAGE_PATTERNS itself
      # never sits in process env for the app to accidentally log or inherit.
      # The IPv4/IPv6 rules run regardless of this file's contents.
      - name: Write leakage denylist to a file
        env:
          LEAKAGE_PATTERNS: ${{ secrets.LEAKAGE_PATTERNS }}
        run: |
          umask 077
          printf '%s' "$LEAKAGE_PATTERNS" > "$RUNNER_TEMP/leakage-patterns.txt"

      - name: Environment disclosure gate
        env:
          LEAKAGE_PATTERNS_FILE: ${{ runner.temp }}/leakage-patterns.txt
        run: npm run leakage

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan full history with gitleaks
        run: ./gitleaks detect --redact --no-banner --verbose --exit-code 1
