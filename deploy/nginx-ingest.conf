# deploy/nginx-ingest.conf -- reverse-proxy vhost FRAGMENT for the ingest
# WebSocket listener ONLY. Install this as its own server block (a
# site-available file, or folded into whatever config this host's existing
# reverse proxy already uses) on the DASHBOARD host's own nginx -- this is
# a separate, host-level process from the `ingest` container it proxies
# to; it is not part of docker-compose.yml (see that file's comment on the
# `ingest` service for the alternative sibling-container topology, in
# which the `proxy_pass` target below would instead be a compose DNS name
# on a shared network rather than 127.0.0.1).
#
# DELIBERATELY INCOMPLETE: there is NO location block for "/" here. The
# dashboard UI (`web` -- loopback-only, no authentication until slice 3)
# must stay reachable ONLY over an SSH tunnel, never through this or any
# other public-facing proxy. Do not add a `location / { proxy_pass
# http://127.0.0.1:3000; }` block "for convenience" -- that is exactly the
# exposure the loopback-only design exists to prevent.
#
# Replace `dashboard.example.invalid` (an RFC 2606 reserved, deliberately
# non-resolvable placeholder) with this deployment's real hostname, and
# point ssl_certificate/ssl_certificate_key at that host's real
# certificate -- both come from this deployment's own DNS and TLS setup,
# never from this repo (see deploy/README.md).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.invalid/privkey.pem;

    # The ingest WebSocket path ONLY. Pick any path prefix you like here,
    # but it must agree with AGENT_DASHBOARD_URL in every monitored host's
    # /etc/bevora-agent/agent.env (see deploy/README.md) -- the listener
    # itself accepts an upgrade on any path, so the path is purely a proxy
    # routing choice, not something the agent or ingest-server validate.
    location /agent/ingest {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # WebSocket upgrade headers. Without these, nginx proxies this
        # location as a plain buffered HTTP request and the upgrade
        # handshake in web/src/server/ingest-server.ts never completes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent holds this connection open indefinitely between polls
        # (see agent/src/transport.ts) rather than reconnecting every
        # tick. A short proxy timeout would silently drop an otherwise
        # healthy connection during a quiet interval.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Plain-HTTP requests to this name redirect to https -- an agent's bearer
# token travels in this request's Authorization header (see
# agent/src/transport.ts), and must never be sent, or accepted, in the
# clear.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.invalid;
    return 301 https://$host$request_uri;
}
